<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inicio - Restaurante</title>
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.6/css/bootstrap.min.css">
    <link rel="stylesheet" href="css/index.css">
    <link rel="stylesheet" href="css/base.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Poppins:wght@400;500&display=swap" rel="stylesheet">
</head>
<body>

    <!-- NAV BAR PRINCIPAL (Compartida en todos los documentos) -->
    <header class="main-header" id="main-header">
        <div class="logo-container" id="logo-container">
           <a href="index.html">
                <img src="img/logo.png" alt="Terra">
            </a>
        </div>
        <div class="user-icon" id="user-icon">
            <img src="img/logo.png" alt="Icono de usuario">
        </div>
        <nav class="main-nav" id="main-nav">
            <ul class="nav-list" id="nav-list">
                <li class="nav-item"><a href="index.html" class="nav-link active">Inicio</a></li>
                <li class="nav-item"><a href="html/menu.html" class="nav-link">Menú</a></li>
                <li class="nav-item"><a href="html/galeria.html" class="nav-link">Galería</a></li>
                <li class="nav-item"><a href="html/reservas.html" class="nav-link">Reservas y Pedidos</a></li>
                <li class="nav-item"><a href="html/contactos.html" class="nav-link">Contacto</a></li>
                <li class="nav-item"><a href="html/desarrolladores.html" class="nav-link">Desarrolladores</a></li>
            </ul>
        </nav>
    </header>


    
    <!-- CHECKBOX OCULTO PARA CONTROLAR EL MENÚ LATERAL MÓVIL -->
    <input type="checkbox" id="sidebar-toggle" class="sidebar-checkbox">

    <!-- WRAPPER GENERAL PARA MÓVIL Y TABLET -->
    <div class="index-layout-wrapper">

        <!-- SIDEBAR / NAVEGACIÓN LATERAL -->
        <aside class="sidebar-navigation" id="sidebar">
            <div class="logo-container">
                <label for="sidebar-toggle" class="brand-toggle" title="Ocultar menú">
                    <img src="img/logo.png" alt="Terra">
                </label>  
            </div>

            <nav class="sidebar-nav">
                <ul class="nav-list-sidebar">
                    <li class="nav-item">
                        <a href="index.html" class="nav-link active">
                            <span class="glyphicon glyphicon-home"></span>
                            <span class="link-text">Inicio</span>
                        </a>
                    </li>
                    <li class="nav-item">
                        <a href="html/menu.html" class="nav-link">
                            <span class="glyphicon glyphicon-cutlery"></span>
                            <span class="link-text">Menú</span>
                        </a>
                    </li>
                    <li class="nav-item">
                        <a href="html/galeria.html" class="nav-link">
                            <span class="glyphicon glyphicon-picture"></span>
                            <span class="link-text">Galería</span>
                        </a>
                    </li>
                    <li class="nav-item">
                        <a href="html/reservas.html" class="nav-link">
                            <span class="glyphicon glyphicon-shopping-cart"></span>
                            <span class="link-text">Pedido</span>
                        </a>
                    </li>
                    <li class="nav-item">
                        <a href="html/contactos.html" class="nav-link">
                            <span class="glyphicon glyphicon-comment"></span>
                            <span class="link-text">Contacto</span>
                        </a>
                    </li>
                    <li class="nav-item">
                        <a href="html/desarrolladores.html" class="nav-link">
                            <span class="glyphicon glyphicon-code"></span>
                            <span class="link-text">Coders</span>
                        </a>
                    </li>
                </ul>
            </nav>

            <div class="user-profile-desktop">
                <span class="glyphicon glyphicon-user"></span>
                <span class="user-name">Usuario</span>
            </div>
        </aside>


    

    <!-- CONTENIDO PRINCIPAL: INTRODUCCIÓN Y PRESENTACIÓN -->
    <main class="main-content" id="main-content-home">
        
        <!-- Contenedor Hero / Presentación -->
        <section class="hero-section" id="hero-section">
            <div class="hero-container" id="hero-container">
                <h2 class="hero-title" id="hero-title">Bienvenido a </h2>
                <p class="hero-description" id="hero-description">Sabores de la tierra</p>
                <div class="hero-actions" id="hero-actions">
                    <a href="html/reservas.html" class="btn btn-primary" id="btn-hero-reserve">Reservar Mesa</a>
                    <a href="html/menu.html" class="btn btn-secondary" id="btn-hero-menu">Ver Menú</a>
                </div>
            </div>
        </section>

        <!-- Contenedor para destacadas o anuncios dinámicos -->
        <section class="highlights-section" id="highlights-section">
            <h2 class="section-title">Especialidades de la Casa</h2>
            <div class="highlights-container" id="highlights-container">
                <!-- JS inyectará aquí información destacada en el futuro -->
            </div>
        </section>
        
    <!-- PIE DE PÁGINA PRINCIPAL -->
    <footer class="main-footer" id="main-footer">
        <div class="footer-container" id="footer-container">
            <p>&copy; Restaurante. Todos los derechos reservados.</p>
        </div>
    </footer>
    </main>

    <script src="js/main.js"></script>
</body>
</html>
