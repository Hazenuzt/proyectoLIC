<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menú - Restaurante</title>
    <link rel="stylesheet" href="css/bootstrap.min.css">
    <link rel="styesheet" href="css/menu.css">
    <link rel="stylesheet" href="css/base.css">

</head>
<body>

    <header class="main-header" id="main-header">
        <div class="logo-container" id="logo-container">
            <h1 class="brand-title" id="brand-title">Restaurante</h1>
        </div>
        <nav class="main-nav" id="main-nav">
            <ul class="nav-list" id="nav-list">
                <li class="nav-item"><a href="../index.html" class="nav-link">Inicio</a></li>
                <li class="nav-item"><a href="menu.html" class="nav-link active">Menú</a></li>
                <li class="nav-item"><a href="galeria.html" class="nav-link">Galería</a></li>

            </ul>
        </nav>
    </header>

    <main class="main-content" id="main-content-menu">
        <section class="menu-section" id="menu-section">
            <h2 class="section-title" id="menu-title">Nuestro Menú</h2>

            <div class="menu-filter-container" id="menu-filter-container">

            <!-- Contenedor Grid donde JS renderizará la lista de platillos -->
            <div class="menu-grid-container" id="menu-grid-container" data-container="dishes-list">
                <!-- JS renderizará cada tarjeta de platillo aquí -->
            </div>
