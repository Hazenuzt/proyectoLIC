<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Usuario</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Poppins:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/base.css">
    <link rel="stylesheet" href="../css/perfil.css">
    <link rel="stylesheet" href="../css/registro.css">
</head>
<body class="register-page">
<div class="booking-layout-wrapper">
         <!-- FRANJA ROJA DE ENCABEZADO A TODO EL ANCHO -->
            <header class="booking-banner-header">
                <h2 class="section-title" id="booking-title">Perfil de Usuario</h2>
            </header>

        <main class="main-content-booking" id="main-content-booking">

                   <!-- Botón de Regreso -->
                    <div class="back-nav-container">
                        <button type="button" class="btn-back" onclick="history.back()">
                            <i class="bi bi-arrow-left" aria-hidden="true"></i> Volver
                        </button>
                    </div>

            <!-- SECCIÓN CENTRAL CENTRADA -->
            <section class="booking-section">
                <div class="profile-card-wrapper mx-auto"> <!-- mx-auto centra la tarjeta -->
                    
             

                    <div class="card profile-content-card">
                        <div class="profile-header-section text-center">
                            <div class="profile-avatar-circle" id="profile-initials">
                                <i class="bi bi-person" aria-hidden="true"></i>
                            </div>
                            <h2 class="profile-username" id="profile-name-display">Nombre de Usuario</h2>
                            <span class="profile-badge">Cliente Registrado</span>
                        </div>

                        <div class="profile-body-section">
                            <h3 class="profile-section-title">Información Personal</h3>
                            
                            <div class="profile-info-grid">
                                <div class="profile-info-row">
                                    <span class="info-label"><i class="bi bi-envelope"></i> Correo Electrónico:</span>
                                    <span class="info-value" id="profile-email-display">usuario@correo.com</span>
                                </div>
                                <div class="profile-info-row">
                                    <span class="info-label"><i class="bi bi-phone"></i> Teléfono:</span>
                                    <span class="info-value" id="profile-phone-display">+503 0000-0000</span>
                                </div>
                                <div class="profile-info-row">
                                    <span class="info-label"><i class="bi bi-calendar-check"></i> Miembro desde:</span>
                                    <span class="info-value">Octubre 2026</span>
                                </div>
                            </div>

                            <div class="profile-actions-row" style="display: flex; gap: 15px; margin-bottom: 12px;">
                                <button type="button" class="btn-custom btn-edit-profile" id="edit-profile-btn">Editar Perfil</button>
                                <button type="button" class="btn-custom btn-logout" id="logout-btn">Cerrar Sesión</button>
                            </div>

                            <div style="text-align: center; margin-top: 15px;">
                                <button type="button" id="delete-account-btn" style="background: transparent; border: none; color: #a93226; font-size: 0.85rem; font-weight: 500; cursor: pointer; text-decoration: underline;">
                                    Eliminar perfil definitivamente
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            </section>

            <!-- FOOTER A TODO EL ANCHO -->
            <footer class="main-footer" id="main-footer">
                <div class="footer-container">
                    <p>&copy; Restaurante. Todos los derechos reservados.</p>
                </div>
            </footer>
        </main>
   <!-- js-->
 <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/registro.js"></script>
</body>
</html>
